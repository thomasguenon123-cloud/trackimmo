# PUBLICATION DU SITE — tests, construction (minification), mise en ligne.
#
# Remplace la publication « depuis la branche » de GitHub Pages, qui servait
# TOUT le dépôt tel quel : audits, SQL, tests, maquettes, et un app.js dont
# plus d'un quart du poids est fait de commentaires (973 Ko, 602 une fois
# minifié — tailles affichées par la construction à chaque publication).
#
# ACTIVÉE LE 18/10/2026 : Thomas a passé Settings › Pages › Source sur
# « GitHub Actions » ; première publication lancée à la main et vérifiée
# (tests, construction, mise en ligne), puis le déclenchement sur `main`.
# Revenir en arrière : remettre la source sur « Deploy from a branch ».
# ⚠️ Un push sur `main` ne se publie QUE par ce fichier : des tests rouges
# arrêtent la publication, et le site reste celui d'avant.
name: Publication

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        run: npm test
      - name: Construction (minification, vérifications)
        run: node scripts/construire.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
